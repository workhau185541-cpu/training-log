<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training Log</title>
<!-- 加入主畫面：icon、名稱 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<style>
 :root{--bg:#121318;--ink:#efe6d4;--dust:#9c958a;--gold:#c8a35d}
 @media (prefers-color-scheme: light){:root{--bg:#f6f2ea;--ink:#1f1d1a;--dust:#736d63;--gold:#9c7630}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;text-align:center}
 img{width:116px;height:116px;border-radius:26px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
 h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:600;letter-spacing:.02em}
 a.go{display:inline-block;padding:14px 34px;border-radius:12px;background:var(--gold);color:#16130c;font-weight:700;text-decoration:none;font-size:16px}
 .install{width:min(100%,385px);text-align:left;line-height:1.65;font-size:14px}
 .install h2{font-size:19px;margin:0 0 8px}
 .install p{margin:0 0 10px;color:var(--dust)}
 .install strong{color:var(--ink)}
 .install ol{margin:0 0 12px;padding-inline-start:22px}
 .install li+li{margin-top:5px}
 .wait{margin:0;color:var(--dust);font-size:14px}
 body.launch .brand,body.launch .install{display:none}
</style>
</head>
<body>
<img class="brand" src="apple-touch-icon.png" alt="" width="116" height="116" hidden onload="this.hidden=false">
<h1>Training Log</h1>
<p class="wait" id="wait" role="status" hidden>正在開啟訓練紀錄。首次使用可能會跳到 Google 登入畫面。</p>
<section class="install" aria-labelledby="install-title">
 <h2 id="install-title">加入手機主畫面</h2>
 <p><strong>請停在這一頁完成安裝。</strong> 先按「打開訓練紀錄」會離開入口頁，加入主畫面時可能只會看到舊的「訓」圖示。</p>
 <ol>
  <li><strong>iPhone</strong>：用 Safari 開啟這一頁，點「分享」→「加入主畫面」。如果看到「以網頁 App 開啟」，請保持開啟。</li>
  <li>確認預覽顯示金色圖示和「Training Log」，再點「加入」。</li>
 </ol>
 <p><strong>Android</strong>：用 Chrome 開啟這一頁，點右上角「⋮」→「加入主畫面」或「安裝」。</p>
 <p>想先試用也可以直接打開。首次使用可能需要登入 Google。</p>
</section>
<a class="go" id="go" href="https://script.google.com/macros/s/AKfycbxDWZ1124FQDlu1KshJsARIdvC5_BvFB0hkfL5W878RJ477UChN2mzhdn8EptuJ38ro/exec">打開訓練紀錄</a>
<script>
 const openLink = document.getElementById('go');
 const standalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
 if (standalone || new URLSearchParams(location.search).has('go')) {
   document.body.classList.add('launch');
   document.getElementById('wait').hidden = false;
   openLink.textContent = '手動開啟訓練紀錄';
   location.replace(openLink.href);
 }
</script>
</body>
</html>
