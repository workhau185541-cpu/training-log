<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>連結 Training Log</title><link rel="stylesheet" href="shell.css"><link rel="apple-touch-icon" href="../apple-touch-icon.png"></head>
<body><main id="home"><img src="../apple-touch-icon.png" class="brand" width="72" height="72" alt=""><h1>Training Log</h1>
<p id="feedback" role="status">正在確認這部裝置…</p>
<form hidden id="verify"><label for="digits">金色圖示內顯示的 6 位數連線碼</label><p><input id="digits" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" style="font:inherit;width:100%;padding:12px"></p><button class="primary">連結我的裝置</button></form>
<button class="primary" type="button" id="done" hidden>關閉登入視窗</button>
<a class="primary" id="back" href="./" hidden>開啟訓練紀錄</a></main>
<script src="endpoints.js"></script><script src="transfer.js"></script><script src="confirm.js?v=7"></script></body></html>
